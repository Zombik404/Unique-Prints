<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your print cart — Unique prints</title>
  <meta name="description" content="Review your private photo selections, print sizes and quantities.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Kaushan+Script&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</head>
<body data-page="cart">
  <header id="site-header"></header>
  <main class="container-site">
    <div class="page-head"><h1 data-i18n="cart.title">Cart</h1></div>
    <div id="cart-root"></div>
  </main>
  <footer id="site-footer"></footer>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const root = document.getElementById("cart-root");
      const cat = await UP.catalogue();
      const sizes = cat.sizes;
      const price = (i) => UP.unitPrice(i, cat);
      const t = UP.t, esc = UP.esc;

      function render() {
        const cart = UP.getCart();
        if (!cart.length) {
          root.innerHTML = '<div style="padding:1.5rem 0 5rem"><p class="muted" style="font-size:1.1rem">' + t("cart.empty") + '</p><a class="btn btn-lg btn-primary" style="margin-top:1.5rem" href="create.html">' + t("cart.continue") + "</a></div>";
          return;
        }
        const subtotal = cart.reduce((a, i) => a + price(i) * i.qty, 0);
        root.innerHTML =
          '<div class="cart-layout"><div>' +
            cart.map((i) => {
              const s = sizes.find((x) => x.id === i.size) || { w: 0, h: 0 };
              return '<div class="cart-item" data-key="' + esc(i.key) + '">' +
                '<div class="thumb' + (i.back ? " pair" : "") + '">' + (i.back ? '<span class="thumb-pair"><img src="' + esc(i.thumb) + '" alt=""><img src="' + esc(i.back.thumb) + '" alt=""></span>' : '<img src="' + esc(i.thumb) + '" alt="">') + "</div>" +
                '<div class="stack" style="gap:.6rem">' +
                  '<div class="row"><div><p style="font-weight:600">' + esc(UP.sizeName(i.size, cat)) + ' <span class="muted small" style="font-weight:400">· ' + (UP.isMug(i.size, cat) ? t("mug.area", { w: s.w, h: s.h }) : s.w + " × " + s.h + " mm · " + t(i.orientation === "landscape" ? "cr.landscape" : "cr.portrait")) + "</span>" + (i.back ? ' <span class="two-sided">' + t("cart.twoSided") + "</span>" : "") + "</p>" +
                  '<p class="muted xsmall" style="margin-top:.2rem">' + esc(i.fileName || "") + (i.back ? " · " + esc(i.back.fileName || "") : "") + "</p></div>" +
                  '<p class="text-primary">' + UP.formatEUR(price(i) * i.qty) + "</p></div>" +
                  '<div class="row"><div class="qty"><button type="button" data-act="minus">−</button><input type="number" min="1" max="50" value="' + i.qty + '" data-act="qty" aria-label="' + t("cr.qty") + '"><button type="button" data-act="plus">+</button></div>' +
                  '<span class="muted xsmall">' + UP.formatEUR(price(i)) + " " + t("cart.each") + "</span>" +
                  '<button type="button" class="btn btn-sm btn-ghost" data-act="remove">' + UP.ICONS.trash + " " + t("cart.remove") + "</button></div>" +
                "</div></div>";
            }).join("") +
            '<a class="btn-link" style="margin-top:1.25rem" href="create.html">+ ' + t("cart.addMore") + "</a>" +
          "</div>" +
          '<aside class="card sticky"><h2>' + t("cart.summary") + "</h2>" +
            '<div style="margin-top:1rem"><div class="summary-line"><span class="muted">' + t("cart.subtotal") + "</span><span>" + UP.formatEUR(subtotal) + "</span></div>" +
            '<div class="summary-line"><span class="muted">' + t("cart.shipping") + '</span><span class="muted small">' + t("cart.shippingTbd") + "</span></div></div>" +
            '<a class="btn btn-lg btn-primary" style="width:100%;margin-top:1.25rem" href="checkout.html">' + t("cart.checkout") + " " + UP.ICONS.arrow + "</a>" +
          "</aside></div>";

        root.querySelectorAll(".cart-item").forEach((row) => {
          const key = row.getAttribute("data-key");
          const update = (fn) => { const c = UP.getCart(); const it = c.find((x) => x.key === key); if (it) fn(c, it); UP.saveCart(c.filter((x) => x.qty > 0)); render(); };
          row.querySelector('[data-act="minus"]').onclick = () => update((c, it) => { it.qty = Math.max(1, it.qty - 1); });
          row.querySelector('[data-act="plus"]').onclick = () => update((c, it) => { it.qty = Math.min(50, it.qty + 1); });
          row.querySelector('[data-act="qty"]').onchange = (e) => update((c, it) => { it.qty = Math.min(50, Math.max(1, Math.round(+e.target.value || 1))); });
          row.querySelector('[data-act="remove"]').onclick = () => update((c, it) => { it.qty = 0; });
        });
      }
      render();
      document.addEventListener("up:lang", render);
    });
  </script>
</body>
</html>
